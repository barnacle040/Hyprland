# #######################################################################################
# CLEANED HYPRLAND CONFIG
# #######################################################################################
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
exec-once = swww-daemon && swww img /home/barnacle/Media/castle.jpg

SDL_VIDEODRIVER=wayland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_nvidia.json

bind = SUPER_SHIFT, R, exec, hyprctl reload
exec-once = hyprpaper
exec-once = dunst
exec-once = waybar & hyprpaper 

################
### MONITORS ###
################

monitor = HDMI-A-2, 1920x1080@100, 0x0, 1
monitor = HDMI-A-1, 1920x1080@60, auto-right, 1
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GTK_THEME,Adwaita-dark
env = XDG_CURRENT_DESKTOP,GNOME
env = ADW_DISABLE_PORTAL,1
###################
### MY PROGRAMS ###
###################

$terminal = ghostty
$fileManager = thunar
$menu = wofi --show drun

exec-once = swaync

# Enable blur on the swaync notification center layer
layerrule = blur on, match:namespace swaync-control-center

# Also blur any popups/toasts from swaync (recommended for consistency)
layerrule = blur_popups on, match:namespace swaync-control-center

# Optional: ignore low-alpha areas so blur looks cleaner (common for panels/notifs)
layerrule = ignore_alpha 0.1, match:namespace swaync-control-center   # tweak 0.1–0.3 to taste; higher = more blur visible through transparency

# For the notification popups themselves (the small ones that appear briefly)
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.1, match:namespace swaync-notification-window
#################
### AUTOSTART ###
#################
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GTK_THEME,Adwaita:dark
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

bind = SHIFT, TAB, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = SHIFT, Q, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%

#####################
### Gpu  settings ###
#####################
# Performance and Error Fixes
decoration {
    rounding = 10

    # Disable blur to save roughly 15% GPU overhead
    blur {
        enabled = false
    }

    # FIX: New syntax for v0.42.0+ 
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    # Fast, snappy bezier curve (0.05, 0.9, 0.1, 1.05)
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    # Reduced duration to 0 for instant feel
    animation = windows, 0, 0, myBezier
    animation = windowsOut, 0, 3, default, popin 80%
    animation = border, 0, 0, default
    animation = fade, 0, 0, default
    animation = workspaces, 0, 0, default
}

misc {
    # Variable Frame Rate: Crucial for battery and CPU silence
    vfr = true
    # Variable Refresh Rate: Use 1 if your monitor supports it
    vrr = 1
    # Removes startup rendering lag
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# iPhone 15 Plus style "Ozone" Fixes for Smooth Scrolling
# Paste these at the top or bottom of your file
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = ELECTRON_OZONE_PLATFORM_HINT,auto
# 1. FIXES LINE 111 & 110: Enable tearing globally
general {
    # ... other settings ...
    allow_tearing = true
}

# 2. FIXES LINE 49: New shadow syntax
decoration {
    rounding = 10
    blur {
        enabled = false
    }
    # Shadows moved to a sub-block in v0.42.0
    shadow {
        enabled = false
    }
}



#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = 0xfff5111
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = true
        size = 8
        passes = 2
    }
}

animations {
    enabled = yes
    bezier = easeOutQuint,0.23,1,0.32,1
    animation = global, 1, 2, default
    animation = windows, 1, 2, easeOutQuint
    animation = workspaces, 1, 1, default, fade
}

dwindle {
    pseudotile = true 
    preserve_split = true 
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0 
}
input {
    # Removes artificial smoothing for 1:1 precision
    accel_profile = flat
    # Faster repeat rate for snappier terminal navigation
    repeat_rate = 50
    repeat_delay = 300
    
    touchpad {
        # Better palm rejection for laptop users
        disable_while_typing = true
        natural_scroll = true
    }
}
###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = CONTROL_ALT, T, exec, $terminal
bind = CONTROL, q, killactive,
bind = $mainMod, X, exit,
bind = $mainMod, E, exec, thunar
bind = $mainMod, V, togglefloating,
bind = SUPER, R, exec, wofi --show drun --show-icons
bind = $mainMod, B, exec, mercury-browser-avx2
bind = $mainMod, J, togglesplit,
bind = SUPER SHIFT, N, exec, swaync-client -t -sw
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, I, exec , torbrowser-launcher
bind = $mainMod, G, exec ,gnome-system-monitor
bind = $mainMod, T, exec ,thunderbird
bind = $mainMod, Q, exec , qbittorrent

# Screenshot to clipboard
bind = $mainMod, Z, exec, grim -g "$(slurp)" - | wl-copy

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3

# Mouse binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

