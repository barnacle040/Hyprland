# #######################################################################################
#  HYPRLAND CONFIG
# #######################################################################################

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GTK_THEME,Adwaita-dark
env = XDG_CURRENT_DESKTOP,GNOME
env = ADW_DISABLE_PORTAL,1

exec-once = swaybg -i /home/admin/Pictures/assci-man.jpg -m fit
exec-once = hyprshade on blue-light-filter
exec-once = dunst
exec-once = waybar & hyprpaper 


SDL_VIDEODRIVER=wayland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_nvidia.json

bind = SUPER_SHIFT, R, exec, hyprctl reload


################
### MONITORS ###
################

monitor = HDMI-A-2, 1920x1080@100, 0x0, 1
monitor = HDMI-A-1, 1920x1080@60, auto-right, 1
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GTK_THEME,Adwaita-dark
env = XDG_CURRENT_DESKTOP,GNOME
env = ADW_DISABLE_PORTAL,1

###################
### MY PROGRAMS ###
###################

$terminal = ghostty
$fileManager = thunar
$menu = wofi --show drun

exec-once = swaync

# Enable blur on the swaync notification center layer
layerrule = blur on, match:namespace swaync-control-center
layerrule = blur_popups on, match:namespace swaync-control-center
layerrule = ignore_alpha 0.1, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.1, match:namespace swaync-notification-window

#################
### AUTOSTART ###
#################
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GTK_THEME,Adwaita:dark
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

bind = SHIFT, TAB, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = SHIFT, Q, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%

#####################
### DECORATION    ###  
#####################
decoration {
    rounding = 0    # SET TO 0 FOR NO ROUNDED CORNERS

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

#####################
### ANIMATIONS    ###
#####################
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 0, 0, myBezier
    animation = windowsOut, 0, 3, default, popin 80%
    animation = border, 0, 0, default
    animation = fade, 0, 0, default
    animation = workspaces, 0, 0, default
}

#####################
### MISC          ###
#####################
misc {
    vfr = true
    vrr = 1
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = ELECTRON_OZONE_PLATFORM_HINT,auto

general {
    allow_tearing = true
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = 0xffF0DFAF
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

dwindle {
    pseudotile = true 
    preserve_split = true 
}

#############
### INPUT ###
#############
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
    repeat_rate = 50
    repeat_delay = 300
    
    touchpad {
        disable_while_typing = true
        natural_scroll = true
    }
}

###################
### KEYBINDINGS ###
###################
$mainMod = SUPER

bind = CONTROL_ALT, T, exec, kitty
bind = CONTROL, q, killactive,
bind = $mainMod, X, exit,
bind = $mainMod, E, exec, thunar
bind = $mainMod, V, togglefloating,
bind = SUPER, R, exec, wofi --show drun --show-icons
bind = $mainMod, B, exec, firefox
bind = $mainMod, J, togglesplit,
bind = SUPER SHIFT, N, exec, swaync-client -t -sw
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, I, exec , torbrowser-launcher
bind = $mainMod, G, exec ,gnome-system-monitor
bind = $mainMod, T, exec ,thunderbird
bind = $mainMod, Q, exec , qbittorrent
bind = $mainMod, Z, exec, grim -g "$(slurp)" - | wl-copy
bind = SUPER SHIFT, Q, exit,


# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3

# Mouse binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
